# Server Configuration
server.port=8080

# Application Name
spring.application.name=globalbank-atm-api

# Default Database: In-Memory H2 (Runs immediately with zero external dependencies)
spring.datasource.url=jdbc:h2:mem:globalbank_atm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
globalbank.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
globalbank.jwt.expiration-ms=86400000

# ATM Business Rules
globalbank.atm.daily-withdrawal-limit=2000.00
globalbank.atm.max-single-deposit=50000.00
globalbank.atm.max-failed-attempts=3

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
